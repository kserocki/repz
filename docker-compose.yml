name: repz

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: repz
      POSTGRES_PASSWORD: repz
      POSTGRES_DB: repz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repz -d repz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
